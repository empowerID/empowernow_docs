name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Show Node/npm versions
        run: |
          node --version
          npm --version

      - name: Remove draft source_content (exclude from build)
        shell: bash
        run: |
          set -euo pipefail
          echo "Before removal:" && ls -la docs || true
          # Direct removal of top-level path just in case
          if [ -d docs/source_content ]; then
            echo "Removing explicit docs/source_content";
            ls -la docs/source_content || true
            rm -rf docs/source_content || true
          fi
          shopt -s globstar nullglob
          for d in docs/**/source_content; do
            echo "Removing draft dir: $d";
            rm -rf "$d" || true;
          done
          # Fallback: case-insensitive match
          for d in $(find docs -type d -iname source_content -print); do
            echo "Removing case-insensitive draft dir: $d";
            rm -rf "$d" || true;
          done
          echo "After removal:" && ls -la docs || true
          echo "Verifying no source_content remains under docs..."
          if find docs -path "*/source_content/*" -print -quit | grep -q "."; then
            echo "Error: source_content still present under docs after removal.";
            find docs -path "*/source_content/*" -print;
            exit 1;
          else
            echo "OK: No source_content under docs.";
          fi
          echo "Debug listing (first 200 matches containing source_content):"
          find docs -iwholename "*source_content*" -print | head -n 200 || true

      - name: Enforce: fail if drafts still present
        run: |
          set -euo pipefail
          if [ -d docs/source_content ]; then
            echo "Found docs/source_content after removal:";
            find docs/source_content -maxdepth 2 -type f -print || true;
            exit 1;
          fi
          hits=$(find docs -path "*/source_content/*" -type f -print | wc -l || true)
          if [ "${hits}" != "0" ]; then
            echo "Found draft files under docs:";
            find docs -path "*/source_content/*" -type f -print;
            exit 1;
          else
            echo "OK: No draft files found under docs.";
          fi

      - name: Install deps
        run: npm ci

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # Double-check and remove again right before build
          shopt -s globstar nullglob
          for d in docs/**/source_content; do
            echo "Removing draft dir pre-build: $d";
            rm -rf "$d" || true;
          done
          if [ -d docs/source_content ]; then rm -rf docs/source_content || true; fi
          for d in $(find docs -type d -iname source_content -print); do rm -rf "$d" || true; done
          # Clear any caches that might reference removed drafts
          rm -rf .docusaurus node_modules/.cache || true
          echo "Final verification:"
          if find docs -path "*/source_content/*" -print -quit | grep -q "."; then
            echo "Error: source_content still present under docs before build.";
            find docs -path "*/source_content/*" -print;
            exit 1;
          fi
          echo "Searching for any doc imports referencing source_content (should be none):"
          if grep -RIn "source_content" docs | grep -v "\.git" | head -n 50; then
            echo "Warning: references to source_content found above (ensure not imported by MDX).";
          else
            echo "OK: no references in markdown to source_content.";
          fi
          npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          # Keep history disabled for smaller gh-pages
          force_orphan: true

