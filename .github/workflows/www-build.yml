name: WWW Build & Links

on:
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci | cat
      - name: Link check (internal only)
        run: node scripts/link-check.mjs | cat
      - name: Build Docusaurus (dry)
        run: npm run build --if-present | cat

