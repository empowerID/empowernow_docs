name: Copy Lint

on:
  pull_request:
    branches: [ main, master ]

jobs:
  copy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run copy lint
        run: node scripts/copy-lint.mjs | cat

