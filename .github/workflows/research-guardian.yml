name: Research Guardian

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main ]

jobs:
  research-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run research lint
        run: node scripts/research-lint.mjs | cat

